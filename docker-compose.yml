services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong-crm-l2
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /app/data/tickets.db
    volumes:
      - ticket_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ticket_data: